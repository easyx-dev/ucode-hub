name: image

# 生产镜像只由本工作流产出：部署仓按 TAG 拉 ghcr.io/easyx-dev/ucode-hub，tag 就是这里推的版本 tag。
# 不在分支 push 上构建——分支镜像没有引用方，只占包容量。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    # 构建含 pnpm install 与 Nitro 打包，卡住就是真卡住，不占着 runner 干等
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        # GHCR 的路径必须全小写，而仓库名保留原大小写，不能直接用 github.repository
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          # 构建上下文是本仓库根（Dockerfile 在根下）
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          # source 让包页面关联回本仓库（否则 GHCR 上的包与仓库互不可见，权限也不好管）
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
